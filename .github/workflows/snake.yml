name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Aurora palette: teal spirit magic -> League gold -> ember orange
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0AC8B9&color_dots=#F0E6D2,#D9C9A3,#C8AA6E,#FF9A5C,#FF7A3D
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF7A3D&color_dots=#0A1015,#0E3B3A,#0A8F86,#0AC8B9,#C8AA6E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
